name: Update README with Issues

on:
  schedule:
    - cron: '0 0 * * *'  # 每天凌晨 0 点运行
  workflow_dispatch:  # 允许手动触发

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Fetch Issues and Update README
      run: |
        python -c '
        import requests
        import os

        # GitHub API token
        token = os.getenv("ISSUSE_TOKEN")

        # Repository information
        owner = os.getenv("GIT_USERNAME")
        repo = os.getenv("REPO_NAME")

        # API URL to fetch issues
        url = f"https://api.github.com/repos/{owner}/{repo}/issues"

        # Headers for API request
        headers = {
            "Authorization": f"token {token}",
            "Accept": "application/vnd.github.v3+json"
        }

        # Fetch issues
        response = requests.get(url, headers=headers)
        issues = response.json()

        # Generate README content
        readme_content = "# 列表\n\n"
        for issue in issues:
            title = issue["title"]
            number = issue["number"]
            url = issue["html_url"]
            readme_content += f"- [{title}]({url}) (# {number})\n"

        # Write to README.md
        with open("README.md", "w") as f:
            f.write(readme_content)
        '

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md
        git commit -m "Update README with issue information" || echo "No changes to commit"
        git push