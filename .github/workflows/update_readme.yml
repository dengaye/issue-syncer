name: Update README with Issues

on:
  schedule:
    - cron: '0 0 * * *'  # 每天凌晨 0 点运行
  workflow_dispatch:  # 允许手动触发

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout this repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        npm install

    - name: Fetch Issues and Update README
      env:
        ISSUSE_TOKEN: ${{ secrets.ISSUSE_TOKEN }}
        GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        REPO_NAMES: ${{ secrets.REPO_NAMES }}
      run: |
        npm run build

    - name: Update target repositories
      env:
        GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        ISSUSE_TOKEN: ${{ secrets.ISSUSE_TOKEN }}
        REPO_NAMES: ${{ secrets.REPO_NAMES }}
      run: |
        IFS=';' read -r -a repoArray <<< "$REPO_NAMES"
        for rawRepo in "${repoArray[@]}"
        do
          repo="$(echo "$rawRepo" | xargs)"
          if [ -z "$repo" ]; then
            continue
          fi

          if [ ! -f "${repo}_README.md" ]; then
            echo "Skip $repo: ${repo}_README.md not found (fetch may have failed)"
            continue
          fi

          echo "Updating $repo"

          git clone --depth 1 https://$GIT_USERNAME:$ISSUSE_TOKEN@github.com/$GIT_USERNAME/$repo.git $repo

          cp "${repo}_README.md" "$repo/README.md"

          cd "$repo"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README with issue information" || echo "No changes to commit"
          git push

          cd -
        done